name: Integration Tests
run-name: >
  Integration Tests (${{ github.event_name }}) - On ${{ github.ref_name }} for ${{ github.event.inputs.keycloak_versions || 'all' }}
  ${{ github.event_name == 'push' && format(' - {0}', github.event.head_commit.id) || '' }}

on:
  push:
  workflow_dispatch:
    inputs:
      keycloak_versions:
        description: 'Keycloak versions to test (comma-separated, or "all")'
        required: false
        default: 'all'
        type: string

env:
  # Increase heap and silence Maven transfer progress logs for clearer CI output
  MAVEN_OPTS: '-Xmx1024m -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn'

jobs:
  prepare:
    runs-on: ubuntu-latest
    name: Prepare
    outputs:
      keycloak_versions: ${{ steps.set-versions.outputs.versions }}
      sha_short: ${{ steps.set-versions.outputs.sha_short }}
      date_short: ${{ steps.set-versions.outputs.date_short }}
      build_suffix: ${{ steps.set-versions.outputs.build_suffix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Determine versions to test
        id: set-versions
        run: |  # shell
          # Determine versions to test
          INPUT_VERSIONS="${{ github.event.inputs.keycloak_versions || 'all' }}"
          SUPPORTED_JSON=$(yq -o=json -I0 '.supported_kc_versions' metadata.yml)
          echo "supported_versions=$SUPPORTED_JSON" >> $GITHUB_OUTPUT

          if [ "$INPUT_VERSIONS" = "all" ]; then
            # Ensure values are strings to avoid YAML/Actions coercion (25.0 -> 25)
            VERSIONS_JSON=$(echo "$SUPPORTED_JSON" | jq -c 'map({version:(.|tostring)})')
          else
            # Parse input, trim spaces, filter against supported and force strings
            VERSIONS_JSON=$(echo "$INPUT_VERSIONS" | jq -R 'split(",") | map(. | sub("^\\s+";"") | sub("\\s+$";""))' | \
              jq --argjson supported "$SUPPORTED_JSON" \
              -c 'map(select(. as $v | $supported | contains([$v]))) | map({version:(.|tostring)})')
          fi

          sha_sort=$(git rev-parse --short HEAD)
          date_short=$(date -u +%Y%m%d)

          echo "versions=$VERSIONS_JSON" >> $GITHUB_OUTPUT
          echo "sha_short=$sha_sort" >> $GITHUB_OUTPUT
          echo "date_short=$date_short" >> $GITHUB_OUTPUT
          echo "build_suffix=IT-$date_short-$sha_sort" >> $GITHUB_OUTPUT


  test:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.keycloak_versions) }}
      fail-fast: false
    name: Build & Test - KC${{ matrix.version }}
    env:
      KEYCLOAK_VERSION: ${{ matrix.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Docker
        uses: docker/setup-docker-action@v5

      - name: Build and run integration tests for Keycloak ${{ matrix.version }}
        run: ./run.sh build -t --keep-containers=never ${{ matrix.version }} ${{ needs.prepare.outputs.build_suffix }}

      - name: Verify build artifacts
        run: |  # shell
          # Verify build artifacts
          ls -la dist/
          # Accept any built JAR (the wrapper can build multiple versions)
          if ls dist/keycloak-cloudfront-auth-*KC${{ matrix.version }}-${{ needs.prepare.outputs.build_suffix }}.jar 1> /dev/null 2>&1; then
            echo "✅ Build artifact found"
          else
            echo "❌ Required build artifacts not found in dist/"
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-keycloak-${{ matrix.version }}-${{ needs.prepare.outputs.build_suffix }}
          path: |
            target/failsafe-reports/
            target/surefire-reports/
            dist/
          retention-days: 7

      - name: Build demo image for Keycloak ${{ matrix.version }}
        run: ./run.sh docker-build demo ${{ matrix.version }}

        
  build-cf-auth-sim:
    runs-on: ubuntu-latest
    needs: prepare
    name: Build cf-auth-sim Docker Image
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker
        uses: docker/setup-docker-action@v5

      - name: Build cf-auth-sim image
        run: ./run.sh docker-build cf-auth-sim

  
  summary:
    runs-on: ubuntu-latest
    needs: [prepare, test, build-cf-auth-sim]
    name: Summary
    if: always()
    permissions:
      checks: write
    steps:
      - name: Generate Test Summary
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          TEST_RESULT: ${{ needs.test.result }}
          CF_AUTH_SIM_RESULT: ${{ needs.build-cf-auth-sim.result }}
        run: | # shell
          # Generate Test Summary
          echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Keycloak versions tested: ${{ needs.prepare.outputs.keycloak_versions }}" >> $GITHUB_STEP_SUMMARY
          echo "- Test and demo build status: $TEST_RESULT" >> $GITHUB_STEP_SUMMARY
          echo "- Build cf-auth-sim status: $CF_AUTH_SIM_RESULT" >> $GITHUB_STEP_SUMMARY

          CHECK_CONCLUSION=success
          CHECK_RESULT=OK
          if [ "$PREPARE_RESULT" != "success" ] || \
             [ "$TEST_RESULT" != "success" ] || \
             [ "$CF_AUTH_SIM_RESULT" != "success" ]; then
            CHECK_CONCLUSION=failure
            CHECK_RESULT=KO
          fi

          echo "- Final check: $CHECK_RESULT" >> $GITHUB_STEP_SUMMARY

          jq -n \
            --arg name "Integration Tests - Final Check" \
            --arg head_sha "$GITHUB_SHA" \
            --arg conclusion "$CHECK_CONCLUSION" \
            --arg result "$CHECK_RESULT" \
            --arg summary "prepare=$PREPARE_RESULT, test=$TEST_RESULT, build-cf-auth-sim=$CF_AUTH_SIM_RESULT" \
            '{name: $name, head_sha: $head_sha, status: "completed", conclusion: $conclusion, output: {title: $result, summary: $summary}}' \
            | gh api --method POST \
                "/repos/${GITHUB_REPOSITORY}/check-runs" \
                --input -

          echo "$CHECK_RESULT"
          if [ "$CHECK_CONCLUSION" = "failure" ]; then
            exit 1
          fi


